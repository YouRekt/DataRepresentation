# Milestone 2: B0, B1 and preprocessing variants P1-P3.
# Every P variant reuses B1's vectorizer settings and the C chosen for B1 on validation.

[b1.tfidf]
# scikit-learn TfidfVectorizer; anything not listed keeps the library default
# (strip_accents=None, analyzer="word", stop_words=None, max_features=None).
lowercase = true
token_pattern = '(?u)\b\w\w+\b'
ngram_range = [1, 1]
min_df = 1
max_df = 1.0
sublinear_tf = false
norm = "l2"
use_idf = true
smooth_idf = true

[b1.logreg]
# liblinear is deterministic, so a single run per variant is enough.
solver = "liblinear"
l1_ratio = 0.0  # pure L2 penalty
class_weight = "none"
max_iter = 1000
C_grid = [0.1, 0.3, 1.0, 3.0, 10.0, 30.0, 100.0, 300.0, 1000.0, 3000.0]

[selection]
# C: highest validation PR-AUC (threshold-free; F1 with 112 val spam is noisy), ties -> smaller C.
# Threshold: highest validation F1 for spam, chosen separately for each variant, never on test.
C_metric = "pr_auc"

[bootstrap]
n = 2000
seed = 42

[typos]
# Controlled typos on test messages: share of words (>= 3 letters) that get one edit.
rates = [0.1, 0.2]
seeds = [0, 1, 2]
